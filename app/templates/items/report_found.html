{% extends "base.html" %}
{% block title %}Report found{% endblock %}
{% block body %}
<div class="relative mx-auto max-w-2xl">
  <p class="text-xs font-bold uppercase tracking-[0.2em] text-cyan-300">Found</p>
  <h1 class="font-display mt-2 text-3xl font-bold tracking-tight text-white sm:text-4xl">Report a found item</h1>
  <p class="mt-2 text-slate-400">Photos help AI describe the object and match it to lost posts.</p>

  <form method="post" enctype="multipart/form-data" class="relative mt-8 space-y-6 overflow-hidden rounded-3xl p-6 glass-card--light sm:p-10" data-loading>
    <div class="form-loading-overlay" aria-hidden="true">
      <div class="flex items-center gap-3 rounded-2xl border border-white/30 bg-white/95 px-5 py-3.5 text-sm font-semibold text-slate-800 shadow-glow">
        <span class="h-5 w-5 animate-spin rounded-full border-2 border-cyan-500 border-t-transparent" aria-hidden="true"></span>
        Submitting…
      </div>
    </div>

    <div class="float-field relative">
      <input name="title" id="found-title" required placeholder=" "
        class="peer rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-5 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-cyan-500 focus:ring-2 focus:ring-cyan-400/30">
      <label for="found-title" class="float-label">Title <span class="text-rose-500">*</span></label>
    </div>

    <div class="float-field relative">
      <textarea name="description" id="found-desc" rows="4" placeholder=" "
        class="peer min-h-[7rem] w-full resize-y rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-6 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-cyan-500 focus:ring-2 focus:ring-cyan-400/30"></textarea>
      <label for="found-desc" class="float-label">Description</label>
    </div>

    <div class="grid gap-6 sm:grid-cols-2">
      <div class="float-field relative">
        <input name="location" id="found-loc" placeholder=" "
          class="peer rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-5 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-cyan-500 focus:ring-2 focus:ring-cyan-400/30">
        <label for="found-loc" class="float-label">Location found</label>
      </div>
      <div class="float-field relative">
        <input name="category" id="found-cat" placeholder=" "
          class="peer rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-5 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-cyan-500 focus:ring-2 focus:ring-cyan-400/30">
        <label for="found-cat" class="float-label">Category</label>
      </div>
    </div>

    <div class="float-field relative">
      <input name="contact_phone" id="found-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder=" "
        class="peer tabular-nums rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-5 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-cyan-500 focus:ring-2 focus:ring-cyan-400/30">
      <label for="found-phone" class="float-label">Contact phone <span class="font-normal normal-case text-slate-400">(optional)</span></label>
    </div>
    <p class="-mt-2 text-xs text-slate-500">Shown to matched users. Spaces and dashes are stripped.</p>

    <div class="rounded-2xl border border-dashed border-cyan-300/50 bg-gradient-to-br from-cyan-50/90 to-indigo-50/60 p-4">
      <label for="found-img" class="mb-2 block text-xs font-bold uppercase tracking-wide text-cyan-900">Photo <span class="font-normal text-cyan-700">(recommended)</span></label>
      <input id="found-img" name="image" type="file" accept="image/*"
        class="block w-full cursor-pointer text-sm text-slate-600 file:mr-4 file:cursor-pointer file:rounded-xl file:border-0 file:bg-gradient-to-r file:from-[#06B6D4] file:to-[#4F46E5] file:px-4 file:py-2.5 file:text-sm file:font-semibold file:text-white file:shadow-md hover:file:brightness-110">
    </div>

    <div class="flex flex-wrap gap-3 pt-2">
      <button type="submit" class="btn-ripple btn-glow rounded-2xl bg-gradient-to-r from-[#06B6D4] via-[#0EA5E9] to-[#4F46E5] px-8 py-3.5 text-sm font-bold text-white shadow-lg">Submit</button>
      <a href="{{ url_for('items.index') }}" class="rounded-2xl border border-slate-300/80 bg-white/50 px-8 py-3.5 text-sm font-semibold text-slate-800 backdrop-blur-sm transition hover:bg-white/90">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
