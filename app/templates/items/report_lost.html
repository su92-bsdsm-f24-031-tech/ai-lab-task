{% extends "base.html" %}
{% block title %}Report lost{% endblock %}
{% block body %}
<div class="relative mx-auto max-w-2xl">
  <p class="text-xs font-bold uppercase tracking-[0.2em] text-rose-300">Lost</p>
  <h1 class="font-display mt-2 text-3xl font-bold tracking-tight text-white sm:text-4xl">Report a lost item</h1>
  <p class="mt-2 text-slate-400">Details and photos improve matching accuracy.</p>

  <form method="post" enctype="multipart/form-data" class="relative mt-8 space-y-6 overflow-hidden rounded-3xl p-6 glass-card--light sm:p-10" data-loading>
    <div class="form-loading-overlay" aria-hidden="true">
      <div class="flex items-center gap-3 rounded-2xl border border-white/30 bg-white/95 px-5 py-3.5 text-sm font-semibold text-slate-800 shadow-glow">
        <span class="h-5 w-5 animate-spin rounded-full border-2 border-[#4F46E5] border-t-transparent" aria-hidden="true"></span>
        Submitting…
      </div>
    </div>

    <div class="float-field relative">
      <input name="title" id="lost-title" required placeholder=" "
        class="peer rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-5 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-[#4F46E5] focus:ring-2 focus:ring-[#8B5CF6]/25">
      <label for="lost-title" class="float-label">Title <span class="text-rose-500">*</span></label>
    </div>

    <div class="float-field relative">
      <textarea name="description" id="lost-desc" rows="4" placeholder=" "
        class="peer min-h-[7rem] w-full resize-y rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-6 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-[#4F46E5] focus:ring-2 focus:ring-[#8B5CF6]/25"></textarea>
      <label for="lost-desc" class="float-label">Description</label>
    </div>

    <div class="grid gap-6 sm:grid-cols-2">
      <div class="float-field relative">
        <input name="location" id="lost-loc" placeholder=" "
          class="peer rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-5 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-[#4F46E5] focus:ring-2 focus:ring-[#8B5CF6]/25">
        <label for="lost-loc" class="float-label">Last seen</label>
      </div>
      <div class="float-field relative">
        <input name="category" id="lost-cat" placeholder=" "
          class="peer rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-5 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-[#4F46E5] focus:ring-2 focus:ring-[#8B5CF6]/25">
        <label for="lost-cat" class="float-label">Category</label>
      </div>
    </div>

    <div class="float-field relative">
      <input name="contact_phone" id="lost-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder=" "
        class="peer tabular-nums rounded-2xl border border-slate-200/80 bg-white/90 px-4 pb-3 pt-5 text-sm text-slate-900 shadow-inner transition placeholder:text-transparent focus:border-[#4F46E5] focus:ring-2 focus:ring-[#8B5CF6]/25">
      <label for="lost-phone" class="float-label">Contact phone <span class="font-normal normal-case text-slate-400">(optional)</span></label>
    </div>
    <p class="-mt-2 text-xs text-slate-500">Shown to matched users. Spaces and dashes are stripped.</p>

    <div class="rounded-2xl border border-dashed border-slate-300/80 bg-gradient-to-br from-indigo-50/80 to-cyan-50/50 p-4">
      <label for="lost-img" class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-600">Photo <span class="font-normal text-slate-400">(optional)</span></label>
      <input id="lost-img" name="image" type="file" accept="image/*"
        class="block w-full cursor-pointer text-sm text-slate-600 file:mr-4 file:cursor-pointer file:rounded-xl file:border-0 file:bg-gradient-to-r file:from-[#4F46E5] file:to-[#8B5CF6] file:px-4 file:py-2.5 file:text-sm file:font-semibold file:text-white file:shadow-md hover:file:brightness-110">
    </div>

    <div class="flex flex-wrap gap-3 pt-2">
      <button type="submit" class="btn-ripple btn-glow rounded-2xl bg-gradient-to-r from-[#4F46E5] via-[#6366F1] to-[#8B5CF6] px-8 py-3.5 text-sm font-bold text-white shadow-lg">Submit</button>
      <a href="{{ url_for('items.index') }}" class="rounded-2xl border border-slate-300/80 bg-white/50 px-8 py-3.5 text-sm font-semibold text-slate-800 backdrop-blur-sm transition hover:bg-white/90">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
