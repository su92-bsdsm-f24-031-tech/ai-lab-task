{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block body %}
<div class="mx-auto max-w-lg rounded-3xl border border-white/10 glass-card p-10 text-center shadow-glow">
  <p class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-[#4F46E5] to-[#06B6D4]">403</p>
  <h1 class="mt-4 text-2xl font-bold text-white">You don’t have access</h1>
  <p class="mt-2 text-slate-400">This area is restricted to administrators.</p>
  <a href="{{ url_for('items.index') }}" class="btn-ripple btn-glow mt-8 inline-flex rounded-2xl bg-gradient-to-r from-[#4F46E5] to-[#8B5CF6] px-6 py-3 text-sm font-semibold text-white shadow-lg transition hover:brightness-110">Back home</a>
</div>
{% endblock %}
