{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block body %}
<div class="mx-auto flex min-h-[calc(100vh-10rem)] max-w-lg items-center justify-center py-8">
  <div class="w-full rounded-3xl border border-white/15 glass-card p-8 shadow-2xl sm:p-10">
    <h1 class="font-display text-center text-2xl font-bold text-white">Create account</h1>
    <p class="mt-2 text-center text-sm text-slate-400">Join FoundBridge to unlock the full experience.</p>

    <form id="register-form" method="post" class="mt-8 space-y-5" data-loading novalidate>
      <div>
        <label for="username" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-400">Username</label>
        <input id="username" name="username" required minlength="2" autocomplete="username"
          class="w-full rounded-2xl border border-white/15 bg-white/90 px-4 py-3.5 text-sm focus:border-[#06B6D4] focus:outline-none focus:ring-2 focus:ring-[#8B5CF6]/35">
      </div>
      <div>
        <label for="email" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-400">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
          class="w-full rounded-2xl border border-white/15 bg-white/90 px-4 py-3.5 text-sm focus:border-[#06B6D4] focus:outline-none focus:ring-2 focus:ring-[#8B5CF6]/35">
      </div>
      <div>
        <label for="password" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-400">Password</label>
        <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password"
          class="w-full rounded-2xl border border-white/15 bg-white/90 px-4 py-3.5 text-sm focus:border-[#06B6D4] focus:outline-none focus:ring-2 focus:ring-[#8B5CF6]/35">
        <p class="mt-1 text-xs text-slate-500">At least 6 characters.</p>
      </div>
      <div>
        <label for="password_confirm" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-400">Confirm password</label>
        <input id="password_confirm" name="password_confirm" type="password" required minlength="6" autocomplete="new-password"
          class="w-full rounded-2xl border border-white/15 bg-white/90 px-4 py-3.5 text-sm focus:border-[#06B6D4] focus:outline-none focus:ring-2 focus:ring-[#8B5CF6]/35">
      </div>
      <p id="password-match-err" class="hidden text-sm font-medium text-rose-300" role="alert"></p>
      <button type="submit" class="btn-ripple btn-glow w-full rounded-2xl bg-gradient-to-r from-[#4F46E5] via-[#8B5CF6] to-cyan-500 py-3.5 text-sm font-bold text-white shadow-lg">Create account</button>
    </form>

    <p class="mt-8 text-center text-sm text-slate-400">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="font-semibold text-cyan-300 underline decoration-cyan-500/40 underline-offset-2 hover:text-white">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
